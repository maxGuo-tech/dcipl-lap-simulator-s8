<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCIPL S8 极速刷圈模拟系统 - 云端版</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --primary-glow: #00d2ff88;
            --danger: #ff2a5f;
            --danger-glow: #ff2a5f88;
            --success: #00ff88;
            --warning: #ffb703;
            --bg-dark: #0a0a0c;
            --panel-bg: rgba(20, 20, 25, 0.85);
            --border-color: #333;
        }

        body {
            font-family: 'Noto Sans SC', 'Segoe UI', Tahoma, sans-serif;
            background: radial-gradient(circle at center, #1a1a24 0%, var(--bg-dark) 100%);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px var(--primary-glow); }
            50% { text-shadow: 0 0 30px var(--primary), 0 0 10px var(--primary); }
            100% { text-shadow: 0 0 10px var(--primary-glow); }
        }
        @keyframes slideIn {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes modalSlideIn {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 标题页 */
        #title-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)" /></svg>');
        }

        .main-title {
            font-family: 'Teko', sans-serif;
            font-size: 5rem;
            margin: 0;
            line-height: 1;
            letter-spacing: 2px;
            color: #fff;
            animation: pulseGlow 3s infinite alternate;
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 1.5rem;
            color: #8892b0;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        /* 玩家登录区 */
        .player-auth {
            background: var(--panel-bg);
            padding: 18px 30px;
            border-radius: 12px;
            border: 1px solid rgba(0,210,255,0.2);
            margin-bottom: 15px;
            max-width: 500px;
            width: 90%;
            display: flex;
            gap: 10px;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .player-auth input {
            flex: 1;
            padding: 10px 14px;
            font-size: 1rem;
            background: #111;
            color: #fff;
            border: 2px solid #444;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .player-auth input:focus { border-color: var(--primary); }
        .player-auth .btn-auth {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #0052d4, #4364f7);
            color: white;
            border: none;
            border-radius: 8px;
            white-space: nowrap;
            transition: all 0.2s;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .player-auth .btn-auth:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(67,100,247,0.4); }
        .player-status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--success);
            font-size: 0.9rem;
        }
        .player-status-bar .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 6px var(--success); }
        #logout-btn { color: #888; cursor: pointer; font-size: 0.8rem; text-decoration: underline; }
        #logout-btn:hover { color: var(--danger); }

        .track-selector-box {
            background: var(--panel-bg);
            padding: 30px 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
        }

        select {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            margin-bottom: 20px;
            background: #111;
            color: var(--primary);
            border: 2px solid #444;
            border-radius: 8px;
            outline: none;
            font-weight: bold;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        select:focus { border-color: var(--primary); }

        .pb-info {
            font-size: 1.2rem;
            margin: 20px 0;
            color: #aaa;
        }
        #pb-display {
            color: var(--success);
            font-family: 'Teko', sans-serif;
            font-size: 1.8rem;
            font-weight: normal;
        }

        .btn-launch {
            width: 100%;
            padding: 15px;
            font-size: 1.5rem;
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            background: linear-gradient(45deg, #0052d4, #4364f7, #6fb1fc);
            color: white;
            border: none;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(67, 100, 247, 0.4);
        }
        .btn-launch:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(67, 100, 247, 0.6); }

        .btn-purple { background: linear-gradient(45deg, #7b2cbf, #9d4edd); color: #fff; width: 100%; margin-top: 15px; }
        .btn-purple:hover { box-shadow: 0 5px 15px rgba(157, 78, 221, 0.4); transform: translateY(-2px); }

        /* 排行榜按钮 */
        .btn-leaderboard {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #b8860b, #ffd700);
            color: #000;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            transition: all 0.2s;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .btn-leaderboard:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,215,0,0.4); }
        .btn-leaderboard-secondary {
            background: rgba(255,215,0,0.1);
            color: #ffd700;
            border: 1px solid rgba(255,215,0,0.3);
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 8px;
            transition: all 0.2s;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .btn-leaderboard-secondary:hover { background: rgba(255,215,0,0.2); transform: translateY(-2px); }

        /* 排行榜弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s;
        }
        .modal-overlay.active { display: flex; }

        .modal-panel {
            background: linear-gradient(160deg, #141419, #1a1a24);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            width: 95%;
            max-width: 780px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            animation: modalSlideIn 0.3s ease-out;
        }
        .modal-panel.wide { max-width: 1000px; }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .modal-header h2 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0,210,255,0.3);
        }
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .modal-close:hover { color: #fff; background: rgba(255,255,255,0.1); }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }
        .modal-body::-webkit-scrollbar { width: 5px; }
        .modal-body::-webkit-scrollbar-track { background: transparent; }
        .modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

        /* 排行榜表格 */
        .lb-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .lb-table th {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .lb-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .lb-table .rank-col { width: 60px; text-align: center; }
        .lb-table .time-col { width: 120px; text-align: right; font-family: 'Teko', sans-serif; font-size: 1.2rem; }
        .lb-table .score-col { width: 120px; text-align: right; font-family: 'Teko', sans-serif; font-size: 1.3rem; }
        .lb-table .detail-col { width: 80px; text-align: center; }
        .lb-table tr:hover { background: rgba(255,255,255,0.03); }
        .lb-table .rank-1 { color: #ffd700; font-weight: bold; font-size: 1.1rem; }
        .lb-table .rank-2 { color: #c0c0c0; font-weight: bold; }
        .lb-table .rank-3 { color: #cd7f32; font-weight: bold; }
        .lb-table .my-row { background: rgba(0,210,255,0.08) !important; }
        .lb-table .my-row td { border-bottom-color: rgba(0,210,255,0.2); }

        .rank-badge {
            display: inline-block;
            width: 28px; height: 28px;
            line-height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* 赛季详情展开 */
        .expand-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: #aaa;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .expand-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

        .detail-row { display: none; }
        .detail-row.active { display: table-row; }
        .detail-row td {
            padding: 0 10px 15px 40px;
            background: rgba(0,0,0,0.3);
        }
        .detail-inner-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        .detail-inner-table th {
            padding: 6px 8px;
            color: #888;
            font-size: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .detail-inner-table td {
            padding: 5px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .detail-inner-table .track-score { color: var(--primary); font-weight: bold; }

        .lb-empty {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1rem;
        }
        .lb-loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* Toast 通知 */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            max-width: 360px;
        }
        .toast-success { background: #0a3a1a; border: 1px solid var(--success); color: var(--success); }
        .toast-error { background: #3a0a0a; border: 1px solid var(--danger); color: var(--danger); }
        .toast-info { background: #0a1a3a; border: 1px solid var(--primary); color: var(--primary); }

        /* 云端同步状态 */
        .cloud-status {
            font-size: 0.75rem;
            color: #666;
            margin-top: 4px;
        }
        .cloud-status.synced { color: var(--success); }
        .cloud-status.syncing { color: var(--warning); }
        .cloud-status.error { color: var(--danger); }

        /* 模拟页 */
        #sim-screen {
            display: none;
            height: 100vh;
            box-sizing: border-box;
            padding: 20px;
            position: relative;
        }
        .sim-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
            background: var(--panel-bg);
            border-bottom: 2px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .track-name-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary);
            margin: 0;
        }
        #sim-status {
            font-size: 1.4rem;
            font-weight: bold;
            color: #aaa;
        }
        .sim-content {
            display: flex;
            justify-content: space-between;
            height: calc(100vh - 120px);
            gap: 20px;
        }
        .main-display {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .time-box { text-align: center; }
        .time-label {
            font-size: 1.5rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: -10px;
        }
        #total-time {
            font-family: 'Teko', sans-serif;
            font-size: 10rem;
            font-weight: 600;
            line-height: 1;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
            font-variant-numeric: tabular-nums;
        }
        .dnf-mode {
            color: var(--danger) !important;
            text-shadow: 0 0 30px var(--danger-glow) !important;
            font-size: 8rem !important;
        }
        .diff-panel {
            margin-top: 20px;
            padding: 15px 40px;
            border-radius: 50px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .diff-label { font-size: 1.2rem; color: #aaa; }
        #diff-time {
            font-family: 'Teko', sans-serif;
            font-size: 3.5rem;
            font-weight: 600;
            line-height: 1;
        }
        .diff-green { color: var(--success); text-shadow: 0 0 10px rgba(0,255,136,0.4); }
        .diff-red { color: var(--danger); text-shadow: 0 0 10px rgba(255,42,95,0.4); }
        .control-panel {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .btn-restart { background: #333; color: white; border: 1px solid #555; }
        .btn-restart:hover { background: #444; border-color: #666; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-warning:hover { background: #e0a000; }
        .btn-danger { background: #222; color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 历史面板 */
        .history-panel {
            width: 480px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .history-header {
            background: #111;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-bottom: 2px solid rgba(255,255,255,0.15);
            text-align: center;
            color: #ffff55;
            letter-spacing: 1px;
        }
        #history-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }
        #history-list::-webkit-scrollbar { width: 4px; }
        #history-list::-webkit-scrollbar-track { background: transparent; }
        #history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        .history-item {
            background: transparent;
            border: none;
            padding: 2px 0;
            animation: slideIn 0.25s ease-out;
            font-family: 'Consolas', 'Courier New', Monaco, monospace;
            font-size: 0.98rem;
            line-height: 1.5;
            color: #ffffff;
            text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.85);
            word-break: break-all;
        }
        .mc-time-bracket { color: #55ffff; }
        .mc-name-bracket { color: #ffff55; font-weight: bold; }
        .mc-point { color: #ffffff; }
        .mc-time-val { color: #ffff55; font-weight: bold; }
        .mc-diff-green { color: #55ff55; font-weight: bold; }
        .mc-diff-red { color: #ff5555; font-weight: bold; }
        .error-detail { color: #ff5555; font-size: 0.9rem; margin-top: 2px; padding-left: 20px; font-family: 'Consolas', 'Courier New', Monaco, monospace; text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.85); }
        .dnf-detail { color: #ff5555; font-weight: bold; font-size: 0.92rem; margin-top: 2px; padding-left: 20px; font-family: 'Consolas', 'Courier New', Monaco, monospace; text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.85); }

        /* 赛季页 */
        #season-screen {
            display: none;
            height: 100vh;
            box-sizing: border-box;
            padding: 20px;
            overflow-y: auto;
            background: radial-gradient(ellipse at top, rgba(157, 78, 221, 0.12) 0%, transparent 60%),
                        radial-gradient(ellipse at bottom, rgba(0, 255, 136, 0.06) 0%, transparent 60%);
        }
        .season-header {
            background: linear-gradient(135deg, rgba(20, 20, 25, 0.95), rgba(40, 25, 60, 0.9));
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid rgba(157, 78, 221, 0.3);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }
        .season-day {
            font-size: 2.5rem;
            color: #fff;
            font-weight: bold;
            font-family: 'Teko', sans-serif;
            text-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
            letter-spacing: 2px;
        }
        .season-day span { color: var(--primary); }
        .season-rem-laps { color: #aaa; margin-top: 5px; font-size: 1.1rem; }
        .season-rem-laps strong { color: #fff; }
        .season-track-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .season-track-card {
            background: linear-gradient(145deg, rgba(20,20,30,0.95), rgba(30,20,40,0.9));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 18px;
            text-align: left;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .season-track-card:hover {
            border-color: rgba(157, 78, 221, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(157, 78, 221, 0.2);
        }
        .season-track-card h3 { margin: 0 0 10px 0; color: #fff; font-size: 1.15rem; }
        .season-track-card input[type="number"] {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(157, 78, 221, 0.3);
            color: var(--primary);
            padding: 10px;
            border-radius: 6px;
            font-size: 1.1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        .season-track-card input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(67, 100, 247, 0.2);
        }
        .season-summary {
            background: linear-gradient(145deg, rgba(20,20,30,0.95), rgba(30,20,45,0.9));
            padding: 25px 30px;
            border-radius: 16px;
            margin-top: 20px;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-family: 'Consolas', monospace;
            transition: background 0.2s;
        }
        .score-row:hover { background: rgba(255,255,255,0.03); }
        .score-row.total {
            font-weight: bold;
            color: var(--success);
            font-size: 1.3rem;
            border-bottom: none;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 2px solid rgba(0, 255, 136, 0.2);
        }
        .season-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;

    <script>
    // ═══════════════════════════════════════════════
    // 🔧 Supabase 配置 — 部署时改成你自己的（共2个值）

    const SUPABASE_URL = 'https://edwrgzguymkdjrlzkdkq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkd3Jnemd1eW1rZGpybHprZGtxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDk4NTU1MiwiZXhwIjoyMTAwNTYxNTUyfQ.0F3fB843vsqtGFU8ewNn7Bia-_K4v5QCIWwR6sGUx-4'; 

    // Supabase REST API 封装（原生 fetch，不依赖任何库）
    async function supabaseCall(path, method = 'GET', body = null) {
        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
        };
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        const r = await fetch(SUPABASE_URL + '/rest/v1' + path, options);
        if (r.status === 204) return null;
        const data = await r.json();
        if (!r.ok) throw new Error(data.message || '请求失败');
        return data;
    }

    async function supabaseRpc(fnName, params) {
        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
        };
        const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fnName, {
            method: 'POST', headers, body: JSON.stringify(params)
        });
        if (r.status === 204) return null;
        const text = await r.text();
        return text ? JSON.parse(text) : null;
    }

    // ═══════════════════════════════════════════════
    // 设备指纹 — 一设备一号限制
    // ═══════════════════════════════════════════════
    async function generateDeviceFingerprint() {
        const components = [
            navigator.userAgent || '',
            navigator.hardwareConcurrency || 'unknown',
            screen.width + 'x' + screen.height + 'x' + screen.colorDepth,
            navigator.language || '',
            navigator.platform || 'unknown',
            new Date().getTimezoneOffset(),
            navigator.maxTouchPoints || 0
        ];
        // Canvas 指纹
        try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 200; canvas.height = 50;
            ctx.textBaseline = 'top'; ctx.font = '14px Arial';
            ctx.fillStyle = '#f60'; ctx.fillRect(0, 0, 100, 25);
            ctx.fillStyle = '#069'; ctx.fillText('DCIPL S8 FP', 2, 2);
            components.push(canvas.toDataURL());
        } catch (e) { components.push('nocanvas'); }
        // WebGL 指纹
        try {
            const gl = document.createElement('canvas').getContext('webgl');
            if (gl) {
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                if (dbg) components.push(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) + '|' + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
            }
        } catch (e) { components.push('nowebgl'); }
        // 哈希
        const str = components.join('###');
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash |= 0;
        }
        return 'fp_' + Math.abs(hash).toString(36);
    }

    // 生成随机密钥
    function generateSecret(len) {
        const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
        const arr = new Uint8Array(len);
        crypto.getRandomValues(arr);
        let result = '';
        for (let i = 0; i < len; i++) result += chars[arr[i] % chars.length];
        return result;
    }

    // ═══════════════════════════════════════════════
    // 玩家身份管理
    // ═══════════════════════════════════════════════
    let playerState = {
        playerId: null,
        secretKey: null,
        username: null,
        isLoggedIn: false
    };

    function loadPlayerState() {
        try {
            const saved = localStorage.getItem('dcipl_s8_player');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.playerId && data.secretKey && data.username) {
                    playerState = data;
                    playerState.isLoggedIn = true;
                }
            }
        } catch (e) {}
    }

    function savePlayerState() {
        localStorage.setItem('dcipl_s8_player', JSON.stringify({
            playerId: playerState.playerId,
            secretKey: playerState.secretKey,
            username: playerState.username
        }));
    }

    function updatePlayerUI() {
        const authArea = document.getElementById('player-auth-area');
        const statusArea = document.getElementById('player-status-area');
        if (playerState.isLoggedIn) {
            authArea.style.display = 'none';
            statusArea.style.display = 'flex';
            document.getElementById('display-username').textContent = playerState.username;
        } else {
            authArea.style.display = 'flex';
            statusArea.style.display = 'none';
        }
    }

    async function handleAuth() {
        const input = document.getElementById('username-input');
        const username = input.value.trim();
        if (!username) { showToast('请输入玩家名称', 'error'); return; }
        if (!/^[\w一-鿿]+$/.test(username)) { showToast('名称只能包含中英文、数字、下划线', 'error'); return; }

        const btn = document.getElementById('btn-auth-action');
        btn.disabled = true;
        btn.textContent = '...';

        try {
            const deviceFp = await generateDeviceFingerprint();

            // 先查设备指纹是否已有账号（自动登录）
            const existing = await supabaseCall(
                '/players?select=id,username,secret_key&device_fingerprint=eq.' + deviceFp + '&limit=1'
            );
            if (existing && existing.length > 0) {
                const p = existing[0];
                playerState.playerId = p.id;
                playerState.secretKey = p.secret_key;
                playerState.username = p.username;
                playerState.isLoggedIn = true;
                savePlayerState();
                updatePlayerUI();
                showToast('检测到该设备已注册账号 ' + p.username + '，已自动登录', 'info');
                btn.disabled = false;
                btn.textContent = '登入';
                return;
            }

            // 新注册
            const secretKey = generateSecret(40);
            const data = await supabaseCall('/players', 'POST', {
                username, secret_key: secretKey, device_fingerprint: deviceFp
            });

            if (data && data.length > 0) {
                playerState.playerId = data[0].id;
                playerState.secretKey = secretKey;
                playerState.username = username;
                playerState.isLoggedIn = true;
                savePlayerState();
                updatePlayerUI();
                showToast('欢迎，' + username + '！已注册并连接云端', 'success');
            }
        } catch (e) {
            const msg = e.message || '';
            if (msg.includes('duplicate') || msg.includes('unique')) {
                showToast('该玩家名已被注册，请换一个名字', 'error');
            } else {
                showToast('网络连接失败: ' + (msg || '请稍后重试'), 'error');
            }
        }
        btn.disabled = false;
        btn.textContent = '登入';
    }

    function logoutPlayer() {
        if (confirm('确定要切换账号吗？')) {
            playerState = { playerId: null, secretKey: null, username: null, isLoggedIn: false };
            localStorage.removeItem('dcipl_s8_player');
            updatePlayerUI();
            document.getElementById('username-input').value = '';
            showToast('已退出登录', 'info');
        }
    }

    // ═══════════════════════════════════════════════
    // Toast 通知
    // ═══════════════════════════════════════════════
    function showToast(msg, type) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast toast-' + (type || 'info');
        toast.textContent = msg;
        container.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; }, 2500);
        setTimeout(() => toast.remove(), 3000);
    }

    // ═══════════════════════════════════════════════
    // 云端 API（直连 Supabase，无需后端服务器）
    // ═══════════════════════════════════════════════
    async function uploadPBToCloud(trackName, totalTime, segments) {
        if (!playerState.isLoggedIn) return null;
        try {
            return await supabaseRpc('submit_track_pb', {
                p_player_id: playerState.playerId,
                p_secret_key: playerState.secretKey,
                p_track_name: trackName,
                p_total_time: totalTime,
                p_segments: segments
            });
        } catch (e) { return null; }
    }

    async function uploadSeasonPBToCloud(totalScore, trackScores, dayCount) {
        if (!playerState.isLoggedIn) return null;
        try {
            return await supabaseRpc('submit_season_pb', {
                p_player_id: playerState.playerId,
                p_secret_key: playerState.secretKey,
                p_total_score: totalScore,
                p_track_scores: trackScores,
                p_day_count: dayCount
            });
        } catch (e) { return null; }
    }

    async function fetchTrackLeaderboard(trackName) {
        try {
            const data = await supabaseCall(
                '/track_pbs?select=best_time,updated_at,players!inner(username)&track_name=eq.' +
                encodeURIComponent(trackName) + '&order=best_time.asc&limit=200'
            );
            let rank = 0, prev = -1, skip = 0;
            const leaderboard = (data || []).map(r => {
                if (r.best_time !== prev) { rank = rank + 1 + skip; skip = 0; }
                else { skip++; }
                prev = r.best_time;
                return { rank, username: r.players.username, best_time: r.best_time, updated_at: r.updated_at };
            });
            return { track_name: trackName, leaderboard };
        } catch (e) { return null; }
    }

    async function fetchSeasonLeaderboard() {
        try {
            const data = await supabaseCall(
                '/season_pbs?select=username,total_score,track_scores,day_count,created_at&order=total_score.desc&limit=200'
            );
            let rank = 0, prev = Infinity, skip = 0;
            const leaderboard = (data || []).map(r => {
                if (r.total_score !== prev) { rank = rank + 1 + skip; skip = 0; }
                else { skip++; }
                prev = r.total_score;
                return { rank, username: r.username, total_score: r.total_score, track_scores: r.track_scores, day_count: r.day_count, created_at: r.created_at };
            });
            return { leaderboard };
        } catch (e) { return null; }
    }

            return;

        let html = '<table class="lb-table"><thead><tr><th class="rank-col">排名</th><th>玩家</th><th class="time-col">最佳成绩</th></tr></thead><tbody>';
        data.leaderboard.forEach(entry => {
            const rankClass = entry.rank === 1 ? 'rank-1' : entry.rank === 2 ? 'rank-2' : entry.rank === 3 ? 'rank-3' : '';
            const isMe = playerState.isLoggedIn && playerState.username === entry.username;
            const rowClass = isMe ? 'my-row' : '';
            html += '<tr class="' + rowClass + '">';
            html += '<td class="rank-col ' + rankClass + '"><span class="rank-badge">' + entry.rank + '</span></td>';

            html += '<td class="time-col">' + entry.best_time.toFixed(2) + ' s</td>';
            html += '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById('lb-body').innerHTML = html;

        };

        let html = '<table class="lb-table"><thead><tr><th class="rank-col">排名</th><th>玩家</th><th class="score-col">赛季总分</th><th class="detail-col">详情</th></tr></thead><tbody>';
        data.leaderboard.forEach((entry, idx) => {
            const rankClass = entry.rank === 1 ? 'rank-1' : entry.rank === 2 ? 'rank-2' : entry.rank === 3 ? 'rank-3' : '';
            const isMe = playerState.isLoggedIn && playerState.username === entry.username;
            const rowClass = isMe ? 'my-row' : '';
            const rowId = 'season-row-' + idx;
            const detailId = 'season-detail-' + idx;

            html += '<tr class="' + rowClass + '" id="' + rowId + '">';
            html += '<td class="rank-col ' + rankClass + '"><span class="rank-badge">' + entry.rank + '</span></td>';
            html += '<td>' + escapeHTML(entry.username) + (isMe ? ' <span style="color:var(--primary);font-size:0.75rem;">(你)</span>' : '') + '</td>';
            html += '<td class="score-col" style="color:var(--primary);">' + entry.total_score.toFixed(2) + '</td>';
            html += '<td class="detail-col"><button class="expand-btn" onclick="toggleSeasonDetail(\'' + detailId + '\', this)" data-detail-id="' + detailId + '">展开 ▼</button></td>';
            html += '</tr>';

            // 详情行
            html += '<tr class="detail-row" id="' + detailId + '"><td colspan="4">';
            html += '<table class="detail-inner-table"><thead><tr><th>赛道</th><th style="text-align:right;">成绩</th><th style="text-align:right;">标准</th><th style="text-align:right;">得分</th></tr></thead><tbody>';
            SEASON_TRACKS_LIST.forEach(track => {
                const ts = entry.track_scores && entry.track_scores[track];
                const timeStr = ts ? ts.time.toFixed(2) + 's' : '--';
                const scoreStr = ts ? ts.score.toFixed(2) : '--';
                const std = STANDARDS[track] || '--';
                html += '<tr><td>' + track + '</td><td style="text-align:right;font-family:Consolas,monospace;">' + timeStr + '</td><td style="text-align:right;color:#888;">' + std + 's</td><td style="text-align:right;" class="track-score">' + scoreStr + '</td></tr>';
            });
            html += '</tbody></table>';
            html += '</td></tr>';
        });
        html += '</tbody></table>';
        document.getElementById('season-lb-body').innerHTML = html;
    }

    function toggleSeasonDetail(detailId, btn) {
        const row = document.getElementById(detailId);
        if (!row) return;
        const isActive = row.classList.contains('active');
        // 关闭所有展开
        document.querySelectorAll('.detail-row.active').forEach(r => r.classList.remove('active'));
        document.querySelectorAll('.expand-btn').forEach(b => b.textContent = '展开 ▼');
        if (!isActive) {
            row.classList.add('active');
            btn.textContent = '收起 ▲';
        }
    }

    function closeSeasonLeaderboard() { closeModal('season-lb-modal'); }

    function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ═══════════════════════════════════════════════
    // 模拟器核心逻辑 (与原有相同，增加云端上传)
    // ═══════════════════════════════════════════════
    let currentTrackName = "";
    let trackSegments = [];
    let currentSegment = 0;
    let accumulatedTime = 0;
    let isPaused = false;
    let simTimeout = null;
    let currentRunPB = [];
    let pbRun = null;
    let isDNF = false;

    function buildTrackSegments(trackName) {
        const track = RAW_TRACKS[trackName];
        let builtSegments = [];

        if (trackName === "和风山岫") {
            track.segments.forEach(baseSeg => {
                builtSegments.push(JSON.parse(JSON.stringify(baseSeg)));
            });
            builtSegments.push({
                id: "2-1", min: 26.50, max: 26.85, errRate: 0.12,
                errs: [
                    {name: "撞墙失误", ranges:[[1.00, 2.00]]},
                    {name: "保守路线选择", ranges:[[0.50, 0.80]]},
                    {name: "掉桥失误", ranges:[[0.60, 1.00]]},
                    {name: "上水失误", ranges:[[0.50, 1.00]]}
                ]
            });
            builtSegments.push({
                id: "2-2", min: 4.10, max: 4.25, errRate: 0.08,
                errs: [
                    {name: "掉水失误(DNF)", isDNF: true},
                    {name: "上草失误", ranges:[[1.00, 1.50]]},
                    {name: "走线失误", ranges:[[0.30, 0.80]]},
                    {name: "保守路线选择", ranges:[[0.40, 0.70]]}
                ]
            });
            for (let i = 2; i < track.segments.length; i++) {
                let seg = JSON.parse(JSON.stringify(track.segments[i]));
                if (seg.id.includes("1-")) {
                    let num = parseInt(seg.id.split("-")[1]);
                    seg.id = "2-" + num;
                } else if (seg.id === "第二圈起始点") {
                    seg.id = "终点";
                }
                builtSegments.push(seg);
            }
            return builtSegments;
        }

        for (let lap = 1; lap <= track.laps; lap++) {
            track.segments.forEach(baseSeg => {
                let seg = JSON.parse(JSON.stringify(baseSeg));
                if (lap > 1) {
                    seg.id = seg.id.replace(/1-/g, lap + "-");
                    if (seg.id.includes("回到起点") || seg.id.includes("至终点")) {
                        seg.id = seg.id.replace("回到起点", lap === track.laps ? "终点" : "回到起点");
                    } else if (seg.id.startsWith("起跑至1-1")) {
                        seg.id = "起跑至" + lap + "-1";
                    } else if (seg.id.startsWith("起跑至")) {
                        seg.id = seg.id.replace("起跑至", "起跑至" + lap + "-");
                        seg.id = seg.id.replace(lap + "-1-1", lap + "-1");
                    }
                    if (track.lap2_mods && track.lap2_mods[seg.id]) {
                        let mod = track.lap2_mods[seg.id];
                        if (mod.min !== undefined) seg.min = mod.min;
                        if (mod.max !== undefined) seg.max = mod.max;
                        if (mod.errRate !== undefined) seg.errRate = mod.errRate;
                    }
                }
                builtSegments.push(seg);
            });
        }
        return builtSegments;
    }

    function updatePBDisplay() {
        currentTrackName = document.getElementById('track-select').value;
        let pbs = JSON.parse(localStorage.getItem('dcipl_s8_pbs_v2')) || {};
        pbRun = pbs[currentTrackName] || null;
        const pbDisplay = document.getElementById('pb-display');
        if (pbRun && pbRun.length > 0) {
            pbDisplay.innerText = pbRun[pbRun.length - 1].toFixed(2) + " S";
        } else {
            pbDisplay.innerText = "NO RECORD";
        }
    }

    function getRandomTime(min, max) {
        let steps = Math.round((max - min) / 0.05);
        let randomStep = Math.floor(Math.random() * (steps + 1));
        return min + randomStep * 0.05;
    }

    function startSim() {
        currentTrackName = document.getElementById('track-select').value;
        trackSegments = buildTrackSegments(currentTrackName);
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('sim-screen').style.display = 'block';
        document.getElementById('header-track-name').innerText = currentTrackName;
        document.getElementById('cloud-status').textContent = '';
        document.getElementById('cloud-status').className = 'cloud-status';
        resetSimVars();
        document.getElementById('sim-status').innerText = ">>> SIMULATION RUNNING <<<";
        document.getElementById('sim-status').style.color = "var(--success)";
        scheduleNextSegment();
    }

    function resetSimVars() {
        clearTimeout(simTimeout);
        currentSegment = 0;
        accumulatedTime = 0;
        isPaused = false;
        isDNF = false;
        currentRunPB = [];
        let pbs = JSON.parse(localStorage.getItem('dcipl_s8_pbs_v2')) || {};
        pbRun = pbs[currentTrackName] || null;
        let totalTimeEl = document.getElementById('total-time');
        totalTimeEl.innerText = "0.00";
        totalTimeEl.classList.remove('dnf-mode');
        document.getElementById('diff-panel').style.opacity = "0";
        document.getElementById('diff-time').innerHTML = "--";
        document.getElementById('history-list').innerHTML = "";
        let btnPause = document.getElementById('btn-pause');
        btnPause.innerText = "暂停";
        btnPause.disabled = false;
    }

    function scheduleNextSegment() {
        simTimeout = setTimeout(processSegment, 1200);
    }

    function getMCNowTime() {
        let now = new Date();
        return "[" + String(now.getHours()).padStart(2, '0') + ":" +
               String(now.getMinutes()).padStart(2, '0') + ":" +
               String(now.getSeconds()).padStart(2, '0') + "]";
    }

    function processSegment() {
        if (isPaused || isDNF) return;
        let seg = trackSegments[currentSegment];
        let normalTime = getRandomTime(seg.min, seg.max);
        let hasError = Math.random() < seg.errRate;
        let errorTime = 0;
        let errorDetailsHtml = "";
        let isClean = true;
        let chosenErrName = "";

        if (hasError && seg.errs && seg.errs.length > 0) {
            let errType = seg.errs[Math.floor(Math.random() * seg.errs.length)];
            chosenErrName = errType.name;
            if (errType.isDNF || (errType.specialDNFProb && Math.random() < errType.specialDNFProb)) {
                isDNF = true;
                isClean = false;
                errorDetailsHtml = '<div class="dnf-detail">> 严重故障: ' + errType.name + ' (坠机DNF)</div>';
            } else {
                isClean = false;
                let chosenRange = errType.ranges[Math.floor(Math.random() * errType.ranges.length)];
                errorTime = getRandomTime(chosenRange[0], chosenRange[1]);
                errorDetailsHtml = '<div class="error-detail">> 警告: ' + errType.name + ' (+' + errorTime.toFixed(2) + 's)</div>';
            }
        }

        let segmentTotalTime = normalTime + errorTime;
        accumulatedTime += segmentTotalTime;
        currentRunPB.push(accumulatedTime);

        let totalTimeEl = document.getElementById('total-time');
        let diffPanel = document.getElementById('diff-panel');
        let diffStr = "";
        let diffClass = "";

        if (isDNF) {
            totalTimeEl.innerText = "DNF";
            totalTimeEl.classList.add('dnf-mode');
            diffPanel.style.opacity = "0";
        } else {
            totalTimeEl.innerText = accumulatedTime.toFixed(2);
            if (pbRun && pbRun[currentSegment]) {
                diffPanel.style.opacity = "1";
                let diff = accumulatedTime - pbRun[currentSegment];
                let diffHtml = "";
                if (Math.abs(diff) < 0.01) {
                    diffStr = "[-0.00秒]";
                    diffClass = "mc-diff-green";
                    diffHtml = '<span class="diff-green">-0.00</span>';
                } else if (diff > 0) {
                    diffStr = "[+" + diff.toFixed(2) + "秒]";
                    diffClass = "mc-diff-red";
                    diffHtml = '<span class="diff-red">+' + diff.toFixed(2) + '</span>';
                } else {
                    diffStr = "[" + diff.toFixed(2) + "秒]";
                    diffClass = "mc-diff-green";
                    diffHtml = '<span class="diff-green">' + diff.toFixed(2) + '</span>';
                }
                document.getElementById('diff-time').innerHTML = diffHtml;
            }
        }

        let historyList = document.getElementById('history-list');
        let item = document.createElement('div');
        item.className = 'history-item';
        let pointName = seg.id;
        let displayTime = isDNF ? "DNF" : segmentTotalTime.toFixed(2);
        let diffRender = (diffStr && !isDNF) ? '<span class="' + diffClass + '">' + diffStr + '</span>' : "";

        item.innerHTML = '<div><span class="mc-time-bracket">' + getMCNowTime() + '</span> <span class="mc-name-bracket">[' + currentTrackName + ']</span> <span class="mc-point">Point ' + pointName + ' 用时</span> <span class="mc-time-val">' + displayTime + '</span> <span class="mc-point">秒</span> ' + diffRender + '</div>' + errorDetailsHtml;
        historyList.appendChild(item);
        historyList.scrollTop = historyList.scrollHeight;

        currentSegment++;

        if (isDNF) {
            document.getElementById('sim-status').innerText = ">>> MISSION FAILED (坠机) <<<";
            document.getElementById('sim-status').style.color = "var(--danger)";
            document.getElementById('btn-pause').disabled = true;
            document.getElementById('cloud-status').textContent = '';
            document.getElementById('cloud-status').className = 'cloud-status';
        } else if (currentSegment >= trackSegments.length) {
            finishRun();
        } else {
            scheduleNextSegment();
        }
    }

    function finishRun() {
        document.getElementById('sim-status').innerText = ">>> RUN COMPLETED <<<";
        document.getElementById('sim-status').style.color = "#aaa";
        document.getElementById('btn-pause').disabled = true;

        let isNewPB = false;
        if (!pbRun || accumulatedTime < pbRun[pbRun.length - 1]) {
            isNewPB = true;
            let pbs = JSON.parse(localStorage.getItem('dcipl_s8_pbs_v2')) || {};
            pbs[currentTrackName] = currentRunPB;
            localStorage.setItem('dcipl_s8_pbs_v2', JSON.stringify(pbs));
            pbRun = currentRunPB;
        }

        if (isNewPB) {
            document.getElementById('sim-status').innerHTML = ">>> NEW RECORD ESTABLISHED <<<";
            document.getElementById('sim-status').style.color = "var(--primary)";

            // 上传到云端
            if (playerState.isLoggedIn) {
                const statusEl = document.getElementById('cloud-status');
                statusEl.textContent = '☁️ 正在同步到云端...';
                statusEl.className = 'cloud-status syncing';
                uploadPBToCloud(currentTrackName, accumulatedTime, currentRunPB).then(result => {
                    if (result && result.updated) {
                        statusEl.textContent = '☁️ 已同步至云端！赛道排名: #' + (result.rank || '?') + ' / ' + (result.total_players || '?') + ' 人';
                        statusEl.className = 'cloud-status synced';
                        showToast('🏆 新PB已上传云端！赛道排名第 ' + (result.rank || '?') + ' 名', 'success');
                    } else if (result && !result.updated) {
                        statusEl.textContent = '☁️ 云端已有更好成绩';
                        statusEl.className = 'cloud-status synced';
                    } else {
                        statusEl.textContent = '⚠️ 云端同步失败，成绩已保存到本地';
                        statusEl.className = 'cloud-status error';
                    }
                });
            } else {
                document.getElementById('cloud-status').textContent = '💡 登入账号后可上传成绩至云端排行榜';
                document.getElementById('cloud-status').className = 'cloud-status';
            }
        }
    }

    function togglePause() {
        if (currentSegment >= trackSegments.length || isDNF) return;
        let btn = document.getElementById('btn-pause');
        isPaused = !isPaused;
        if (isPaused) {
            btn.innerText = "恢复运行";
            clearTimeout(simTimeout);
            document.getElementById('sim-status').innerText = ">>> SYSTEM PAUSED <<<";
            document.getElementById('sim-status').style.color = "var(--warning)";
        } else {
            btn.innerText = "暂停";
            document.getElementById('sim-status').innerText = ">>> SIMULATION RUNNING <<<";
            document.getElementById('sim-status').style.color = "var(--success)";
            scheduleNextSegment();
        }
    }

    function restartSim() {
        resetSimVars();
        document.getElementById('cloud-status').textContent = '';
        document.getElementById('cloud-status').className = 'cloud-status';
        document.getElementById('sim-status').innerText = ">>> SIMULATION RUNNING <<<";
        document.getElementById('sim-status').style.color = "var(--success)";
        scheduleNextSegment();
    }

    function exitSim() {
        clearTimeout(simTimeout);
        document.getElementById('sim-screen').style.display = 'none';
        document.getElementById('title-screen').style.display = 'flex';
        updatePBDisplay();
    }

    // ═══════════════════════════════════════════════
    // 赛季模式 (增加云端上传)
    // ═══════════════════════════════════════════════
    const SEASON_TRACKS = [
        "恶地矿山采集场", "极地冰封王座", "炼狱祭坛", "层级教学关卡",
        "宇宙城科技区", "海岸冰场", "世纪天城", "和风山岫",
        "鹦特拉格斯", "宇宙城热电站", "极地破碎雪原"
    ];

    const SEASON_STANDARDS = {
        "恶地矿山采集场": 114, "极地冰封王座": 122, "炼狱祭坛": 126,
        "层级教学关卡": 95, "宇宙城科技区": 55, "海岸冰场": 90,
        "世纪天城": 98, "和风山岫": 117, "鹦特拉格斯": 83,
        "宇宙城热电站": 118, "极地破碎雪原": 118
    };

    let seasonState = { day: 1, totalDays: 8, remLaps: 100, bestTimes: {}, dayResults: {}, savedAllocation: {} };

    function generateDefaultAllocation() {
        const alloc = {};
        const total = 100;
        const trackCount = SEASON_TRACKS.length;
        const base = Math.floor(total / trackCount);
        let remainder = total - base * trackCount;
        SEASON_TRACKS.forEach(track => {
            alloc[track] = base + (remainder > 0 ? 1 : 0);
            if (remainder > 0) remainder--;
        });
        seasonState.savedAllocation = JSON.parse(JSON.stringify(alloc));
    }

    function initializeSeason() {
        SEASON_TRACKS.forEach(track => { seasonState.bestTimes[track] = null; });
        if (Object.keys(seasonState.savedAllocation).length === 0) { generateDefaultAllocation(); }
    }

    function openSeasonMode() {
        initializeSeason();
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('season-screen').style.display = 'block';
        document.getElementById('season-summary-area').style.display = 'none';
        document.getElementById('season-setup-area').style.display = 'block';
        document.getElementById('season-upload-status').innerHTML = '';
        renderSeasonTrackGrid();
        updateSeasonHeader();
    }

    function exitSeason() {
        document.getElementById('season-screen').style.display = 'none';
        document.getElementById('title-screen').style.display = 'flex';
        updatePBDisplay();
    }

    function renderSeasonTrackGrid() {
        const grid = document.getElementById('season-track-grid');
        grid.innerHTML = '';
        SEASON_TRACKS.forEach(track => {
            const card = document.createElement('div');
            card.className = 'season-track-card';
            const bestTime = seasonState.bestTimes[track];
            const bestStr = bestTime ? bestTime.toFixed(2) + 's' : '暂无记录';
            const defaultVal = seasonState.savedAllocation[track] || 0;
            card.innerHTML = '<h3>' + track + '</h3><div style="color:#888; font-size:0.85rem; margin-bottom:8px;">赛季最佳: <span style="color:var(--success);">' + bestStr + '</span></div><label style="color:#aaa; font-size:0.85rem;">今日分配次数:</label><input type="number" id="season-lap-' + track + '" min="0" max="100" value="' + defaultVal + '" onchange="updateSeasonLapCount()">';
            grid.appendChild(card);
        });
        updateSeasonLapCount();
    }

    function saveCurrentAllocation() {
        SEASON_TRACKS.forEach(track => {
            const input = document.getElementById('season-lap-' + track);
            if (input) { seasonState.savedAllocation[track] = parseInt(input.value) || 0; }
        });
        localStorage.setItem('dcipl_s8_season_alloc', JSON.stringify(seasonState.savedAllocation));
        alert('当前分配方案已保存为默认方案！');
    }

    function loadSavedAllocation() {
        const saved = localStorage.getItem('dcipl_s8_season_alloc');
        if (saved) { seasonState.savedAllocation = JSON.parse(saved); }
        SEASON_TRACKS.forEach(track => {
            const input = document.getElementById('season-lap-' + track);
            if (input) { input.value = seasonState.savedAllocation[track] || 0; }
        });
        updateSeasonLapCount();
    }

    function updateSeasonHeader() {
        document.getElementById('season-day-display').innerHTML = 'DAY <span>' + seasonState.day + '</span> / ' + seasonState.totalDays;
        document.getElementById('rem-laps-count').innerText = seasonState.remLaps;
    }

    function simulateSingleRun(trackName) {
        const segs = buildTrackSegments(trackName);
        let acc = 0;
        let isDNF = false;
        for (let i = 0; i < segs.length; i++) {
            const seg = segs[i];
            const normalTime = getRandomTime(seg.min, seg.max);
            let errorTime = 0;
            const hasError = Math.random() < seg.errRate;
            if (hasError && seg.errs && seg.errs.length > 0) {
                const errType = seg.errs[Math.floor(Math.random() * seg.errs.length)];
                if (errType.isDNF || (errType.specialDNFProb && Math.random() < errType.specialDNFProb)) {
                    isDNF = true;
                    break;
                } else {
                    const chosenRange = errType.ranges[Math.floor(Math.random() * errType.ranges.length)];
                    errorTime = getRandomTime(chosenRange[0], chosenRange[1]);
                }
            }
            acc += normalTime + errorTime;
        }
        return { time: acc, isDNF };
    }

    function updateSeasonLapCount() {
        let total = 0;
        SEASON_TRACKS.forEach(track => {
            const input = document.getElementById('season-lap-' + track);
            if (input) total += parseInt(input.value) || 0;
        });
        seasonState.remLaps = Math.max(0, 100 - total);
        document.getElementById('rem-laps-count').innerText = seasonState.remLaps;
    }

    function executeSeasonDay() {
        let total = 0;
        const allocations = {};
        SEASON_TRACKS.forEach(track => {
            const input = document.getElementById('season-lap-' + track);
            const val = parseInt(input.value) || 0;
            allocations[track] = val;
            total += val;
        });
        if (total > 100) { alert('今日分配次数超过100次！请调整。'); return; }
        if (total === 0) { alert('请至少分配一次刷圈。'); return; }

        const dayKey = 'day' + seasonState.day;
        if (!seasonState.dayResults[dayKey]) seasonState.dayResults[dayKey] = {};

        SEASON_TRACKS.forEach(track => {
            const count = allocations[track];
            if (count === 0) return;
            let bestTime = Infinity;
            for (let i = 0; i < count; i++) {
                const result = simulateSingleRun(track);
                if (!result.isDNF && result.time < bestTime) bestTime = result.time;
            }
            if (bestTime < Infinity) {
                seasonState.dayResults[dayKey][track] = bestTime;
                if (seasonState.bestTimes[track] === null || seasonState.bestTimes[track] === undefined || bestTime < seasonState.bestTimes[track]) {
                    seasonState.bestTimes[track] = bestTime;
                }
            } else {
                seasonState.dayResults[dayKey][track] = null;
            }
        });

        seasonState.day++;
        seasonState.remLaps = 100;

        if (seasonState.day > seasonState.totalDays) {
            showSeasonSummary();
        } else {
            updateSeasonHeader();
            renderSeasonTrackGrid();
            alert('第 ' + (seasonState.day - 1) + ' 天模拟完成！已进入第 ' + seasonState.day + ' 天（保留前一天分配方案）。');
        }
    }

    function showSeasonSummary() {
        document.getElementById('season-setup-area').style.display = 'none';
        document.getElementById('season-summary-area').style.display = 'block';
        const list = document.getElementById('season-scores-list');
        list.innerHTML = '';
        let totalScore = 0;
        const trackScoresForUpload = {};

        SEASON_TRACKS.forEach(track => {
            const pb = seasonState.bestTimes[track];
            const standard = SEASON_STANDARDS[track];
            let score = 0;
            let scoreStr = '未完成';
            if (pb !== null && pb !== undefined) {
                score = 100 - (pb - standard);
                score = Math.round(score * 100) / 100;
                totalScore += score;
                scoreStr = score.toFixed(2) + ' 分';
                trackScoresForUpload[track] = { time: pb, score: score };
            }
            const row = document.createElement('div');
            row.className = 'score-row';
            row.innerHTML = '<span>' + track + '</span><span><span style="color:#aaa;">标准 ' + standard + 's | PB ' + (pb !== null ? pb.toFixed(2) + 's' : '--') + '</span><span style="color:var(--primary); margin-left:10px; font-weight:bold;">' + scoreStr + '</span></span>';
            list.appendChild(row);
        });

        const totalRow = document.createElement('div');
        totalRow.className = 'score-row total';
        totalRow.innerHTML = '<span>赛季总分</span><span>' + totalScore.toFixed(2) + ' 分</span>';
        list.appendChild(totalRow);

        // 上传赛季总分到云端
        const uploadStatusEl = document.getElementById('season-upload-status');
        if (playerState.isLoggedIn) {
            uploadStatusEl.innerHTML = '<div style="color:var(--warning);">☁️ 正在上传赛季总分...</div>';
            uploadSeasonPBToCloud(totalScore, trackScoresForUpload, seasonState.totalDays).then(result => {
                if (result && result.updated) {
                    uploadStatusEl.innerHTML = '<div style="color:var(--success);">🏆 赛季总分已上传云端！赛季排名: #' + (result.rank || '?') + ' / ' + (result.total_players || '?') + ' 人</div>';
                    showToast('🏆 赛季总分 PB 已上传！排名第 ' + (result.rank || '?') + ' 名', 'success');
                } else if (result && !result.updated) {
                    uploadStatusEl.innerHTML = '<div style="color:#888;">☁️ 云端已有更好的赛季成绩 (最佳: ' + result.best_score.toFixed(2) + ' 分)</div>';
                } else {
                    uploadStatusEl.innerHTML = '<div style="color:var(--danger);">⚠️ 上传失败，成绩仅保存在本地</div>';
                }
            });
        } else {
            uploadStatusEl.innerHTML = '<div style="color:#888;">💡 <a href="#" onclick="exitSeason(); setTimeout(function(){document.getElementById(\'username-input\').focus();}, 300);" style="color:var(--primary);">登入账号</a>后可上传赛季总分至云端排行榜</div>';
        }
    }

    function resetSeason() {
        if (!confirm('确定要重置整个赛季数据吗？')) return;
        seasonState = { day: 1, totalDays: 8, remLaps: 100, bestTimes: {}, dayResults: {}, savedAllocation: {} };
        generateDefaultAllocation();
        document.getElementById('season-summary-area').style.display = 'none';
        document.getElementById('season-setup-area').style.display = 'block';
        document.getElementById('season-upload-status').innerHTML = '';
        renderSeasonTrackGrid();
        updateSeasonHeader();
    }

    // ═══════════════════════════════════════════════
    // 初始化
    // ═══════════════════════════════════════════════
    function init() {
        loadPlayerState();
        updatePlayerUI();
        updatePBDisplay();
        // 回车键登录
        document.getElementById('username-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleAuth();
        });
    }

    init();
    </script>
</body>
</html>
